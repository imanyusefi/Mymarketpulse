<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ترمینال مالی هوشمند</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #ffffff; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .header { text-align: center; margin-bottom: 10px; }
        .header h1 { font-size: 1.5rem; font-weight: 800; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
        .card-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; color: #e2e8f0; }
        .data-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .data-row:last-child { border-bottom: none; }
        .data-label { display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 0.95rem; }
        .data-value { font-weight: bold; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
        .value-green { color: #4ade80; }
        .value-red { color: #f87171; }
        .value-blue { color: #60a5fa; }
        .action-btn { margin-top: auto; background: linear-gradient(90deg, #3b82f6, #8b5cf6); color: white; border: none; padding: 15px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .action-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="header"><h1>💠 ترمینال مالی هوشمند</h1></div>
    <div class="glass-card">
        <div class="card-title"><i class="fa-solid fa-chart-line"></i> بازار فارکس</div>
        <div class="data-row"><span class="data-label">💵 شاخص دلار (DXY)</span><span class="data-value value-blue">104.25</span></div>
        <div class="data-row"><span class="data-label">🇪🇺 یورو / دلار</span><span class="data-value value-green">1.0980</span></div>
        <div class="data-row"><span class="data-label">🇬🇧 پوند / دلار</span><span class="data-value value-red">1.3117</span></div>
    </div>
    <div class="glass-card">
        <div class="card-title"><i class="fa-brands fa-bitcoin"></i> بازار کریپتو</div>
        <div class="data-row"><span class="data-label">💰 ارزش کل بازار</span><span class="data-value">$2,028.90B</span></div>
        <div class="data-row"><span class="data-label">👑 دامیننس بیت‌کوین</span><span class="data-value value-green">57.47%</span></div>
    </div>
    <div class="glass-card">
        <div class="card-title"><i class="fa-solid fa-face-smile"></i> شاخص ترس و طمع</div>
        <div class="data-row"><span class="data-label">وضعیت بازار</span><span class="data-value value-red">ترس شدید (12)</span></div>
    </div>
    <button class="action-btn">🔄 به‌روزرسانی داده‌ها</button>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.setHeaderColor('#0f172a');
    </script>
</body>
</html>
